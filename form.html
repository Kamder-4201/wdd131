<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Product review form for WDD131 created by Kamder-4201" />
        <meta name="author" content="Jeff Bernard Candelario" />
        <title>Fusion Delights Product Review</title>
        <!-- FAV ICO -->
        <link rel="icon" type="images/x-icon" href="project/images/fav.svg" />

        <!-- FONTS -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
            rel="stylesheet"
        />

        <!-- CSS -->
        <link rel="stylesheet" href="styles/form.css" />

        <!-- SCRIPTS -->
        <script src="scripts/getdates.js" defer></script>
        <script src="scripts/viewport.js" defer></script>
        <script src="scripts/form.js" defer></script>
    </head>
    <body>
        <header>
            <div class="header-inner">
                <div class="logo" aria-hidden="true">
                    <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                        <rect class="logo-brownie" x="6" y="10" width="28" height="22" rx="4" />
                        <ellipse class="logo-oat" cx="14" cy="18" rx="3.5" ry="2" transform="rotate(-25 14 18)" />
                        <ellipse class="logo-oat" cx="24" cy="16" rx="3.5" ry="2" transform="rotate(20 24 16)" />
                        <ellipse class="logo-oat" cx="19" cy="25" rx="3.5" ry="2" transform="rotate(-10 19 25)" />
                        <ellipse class="logo-oat" cx="28" cy="25" rx="3.5" ry="2" transform="rotate(30 28 25)" />
                    </svg>
                </div>
                <div>
                    <p class="eyebrow">Website planning document</p>
                    <h1>The Brownie Oat Fusion</h1>
                </div>
            </div>
        </header>

        <main>
            <form action="review.html" method="get">
                <!-- Product Name -->
                <p>
                    <label for="product">Product Name</label>
                    <select id="product" name="product" required>
                        <option value="" disabled selected>Select a Product ...</option>
                        <!-- remaining options are added by the script below -->
                    </select>
                </p>

                <!-- Overall Rating -->
                <fieldset class="rating">
                    <legend>Overall Rating</legend>

                    <div>
                        <label for="rating1">&star;</label>
                        <input type="radio" id="rating1" name="rating" value="1" required />
                    </div>
                    <div>
                        <label for="rating2">&star;&star;</label>
                        <input type="radio" id="rating2" name="rating" value="2" />
                    </div>
                    <div>
                        <label for="rating3">&star;&star;&star;</label>
                        <input type="radio" id="rating3" name="rating" value="3" />
                    </div>
                    <div>
                        <label for="rating4">&star;&star;&star;&star;</label>
                        <input type="radio" id="rating4" name="rating" value="4" />
                    </div>
                    <div>
                        <label for="rating5">&star;&star;&star;&star;&star;</label>
                        <input type="radio" id="rating5" name="rating" value="5" />
                    </div>
                </fieldset>

                <!-- Date of Installation -->
                <p>
                    <label for="install-date">Date of Installation</label>
                    <input type="date" id="install-date" name="install-date" required />
                </p>

                <!-- Useful Features -->
                <fieldset class="features">
                    <legend>
                        Which features did you find useful in the product?
                        <em>(Check all that apply)</em>
                    </legend>

                    <div>
                        <input type="checkbox" id="durability" name="features" value="durability" />
                        <label for="durability">Durability</label>
                    </div>
                    <div>
                        <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use" />
                        <label for="ease-of-use">Ease of Use</label>
                    </div>
                    <div>
                        <input type="checkbox" id="performance" name="features" value="performance" />
                        <label for="performance">Performance</label>
                    </div>
                    <div>
                        <input type="checkbox" id="design" name="features" value="design" />
                        <label for="design">Design</label>
                    </div>
                </fieldset>

                <!-- Written Review (optional) -->
                <p>
                    <label for="review-text">Written Review <span class="optional">(Optional)</span></label>
                    <textarea id="review-text" name="review-text" rows="6"></textarea>
                </p>

                <!-- User Name (optional) -->
                <p>
                    <label for="user-name">Your Name <span class="optional">(Optional)</span></label>
                    <input type="text" id="user-name" name="user-name" />
                </p>

                <!-- Submit -->
                <p>
                    <input type="submit" value="Post Review" />
                </p>
            </form>
        </main>

        <footer>
            <p>&copy; <span id="currentyear"></span>🌴 Jeff Bernard Candelario 👒 Philippines</p>

            <p>Last Modified: <span id="lastModified"></span></p>

            <div id="viewport-size">Width: <span></span>px</div>
        </footer>
    </body>
</html>
